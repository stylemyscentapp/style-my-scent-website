name: Temporary image worklist PDF
on:
  pull_request:
    branches: [main]
  push:
    branches: [tmp-image-worklist-20260920]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab
      - name: Build detailed PDF
        run: |
          cat tmp/image_worklist_part1.csv tmp/image_worklist_part2.csv tmp/image_worklist_part3.csv > /tmp/worklist.csv
          cat > /tmp/build_pdf.py <<'PY'
          import csv, re
          from pathlib import Path
          from reportlab.lib import colors
          from reportlab.lib.pagesizes import landscape, letter
          from reportlab.lib.styles import ParagraphStyle
          from reportlab.lib.enums import TA_CENTER
          from reportlab.lib.units import inch
          from reportlab.platypus import SimpleDocTemplate, Table, TableStyle, Paragraph, Spacer, PageBreak

          src=Path('/tmp/worklist.csv')
          out=Path('Style_My_Scent_Exact_Bottle_Image_Worklist.pdf')
          with src.open(encoding='utf-8-sig', newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==2093, len(rows)

          PAGE=landscape(letter)
          doc=SimpleDocTemplate(str(out), pagesize=PAGE, leftMargin=0.3*inch, rightMargin=0.3*inch, topMargin=0.35*inch, bottomMargin=0.35*inch)
          title=ParagraphStyle('title',fontName='Helvetica-Bold',fontSize=18,leading=21,alignment=TA_CENTER,spaceAfter=6)
          sub=ParagraphStyle('sub',fontName='Helvetica',fontSize=8.5,leading=11,alignment=TA_CENTER,textColor=colors.HexColor('#444444'),spaceAfter=10)
          cell=ParagraphStyle('cell',fontName='Helvetica',fontSize=6.6,leading=8)
          cellb=ParagraphStyle('cellb',parent=cell,fontName='Helvetica-Bold')
          url=ParagraphStyle('url',parent=cell,fontSize=5.7,leading=7,textColor=colors.HexColor('#1d4ed8'))

          story=[
            Paragraph('STYLE MY SCENT',title),
            Paragraph('Exact Bottle Image Acquisition Worklist - 2,093 verified parked products',ParagraphStyle('t2',parent=title,fontSize=13,leading=16)),
            Paragraph('Each row tells you the exact bottle/product, its type, what needs to be obtained, and the existing product/source page. The final column is left blank for the direct image URL you find. The 4 unreleased/deferred products are intentionally excluded.',sub),
          ]
          summary=[
            ['Total exact rows','2,093'],
            ['Perfume oils','247'],
            ['Active catalog missing images','0'],
            ['Need for every row','Exact correct product image + direct image URL'],
          ]
          st=Table(summary,colWidths=[2.7*inch,4.2*inch])
          st.setStyle(TableStyle([
            ('BACKGROUND',(0,0),(0,-1),colors.HexColor('#222222')),('TEXTCOLOR',(0,0),(0,-1),colors.white),
            ('FONTNAME',(0,0),(0,-1),'Helvetica-Bold'),('GRID',(0,0),(-1,-1),0.4,colors.HexColor('#bbbbbb')),
            ('FONTSIZE',(0,0),(-1,-1),8),('TOPPADDING',(0,0),(-1,-1),4),('BOTTOMPADDING',(0,0),(-1,-1),4)
          ]))
          story += [st, Spacer(1,8)]

          data=[[Paragraph('<b>#</b>',cell),Paragraph('<b>Brand</b>',cell),Paragraph('<b>Exact bottle / product</b>',cell),
                 Paragraph('<b>Type</b>',cell),Paragraph('<b>What to obtain</b>',cell),
                 Paragraph('<b>Existing product/source page</b>',cell),Paragraph('<b>Direct image URL / result</b>',cell)]]
          for r in rows:
              source=r.get('Existing product/source page','')
              source_disp=source
              if len(source_disp)>76:
                  source_disp=source_disp[:73]+'...'
              data.append([
                Paragraph(r['#'],cell),
                Paragraph(r['Brand'].replace('&','&amp;'),cellb),
                Paragraph(r['Exact bottle / product'].replace('&','&amp;'),cell),
                Paragraph(r['Product type'].replace('&','&amp;'),cell),
                Paragraph(r['What we need'].replace('&','&amp;'),cell),
                Paragraph(source_disp.replace('&','&amp;'),url),
                Paragraph('________________________________',cell),
              ])
          widths=[0.35*inch,1.25*inch,2.25*inch,1.05*inch,1.8*inch,2.65*inch,1.45*inch]
          tbl=Table(data,colWidths=widths,repeatRows=1)
          ts=[
            ('BACKGROUND',(0,0),(-1,0),colors.HexColor('#171717')),('TEXTCOLOR',(0,0),(-1,0),colors.white),
            ('VALIGN',(0,0),(-1,-1),'TOP'),('GRID',(0,0),(-1,-1),0.25,colors.HexColor('#d0d0d0')),
            ('LEFTPADDING',(0,0),(-1,-1),3),('RIGHTPADDING',(0,0),(-1,-1),3),
            ('TOPPADDING',(0,0),(-1,-1),3),('BOTTOMPADDING',(0,0),(-1,-1),3),
          ]
          for i,r in enumerate(rows,1):
              if r['Brand']=='Sand + Fog':
                  ts.append(('BACKGROUND',(0,i),(-1,i),colors.HexColor('#fffaf0')))
              elif r['Brand']=='Scentual Obsessions':
                  ts.append(('BACKGROUND',(0,i),(-1,i),colors.HexColor('#f2f2f2')))
              elif i%2==0:
                  ts.append(('BACKGROUND',(0,i),(-1,i),colors.HexColor('#fafafa')))
          tbl.setStyle(TableStyle(ts))
          story.append(tbl)

          def footer(canvas,doc):
              canvas.saveState()
              canvas.setFont('Helvetica',6.5)
              canvas.setFillColor(colors.HexColor('#666666'))
              canvas.drawString(0.3*inch,0.18*inch,'Style My Scent - Exact Bottle Image Worklist')
              canvas.drawRightString(PAGE[0]-0.3*inch,0.18*inch,f'Page {doc.page}')
              canvas.restoreState()
          doc.build(story,onFirstPage=footer,onLaterPages=footer)
          print(out, len(rows))
          PY
          python /tmp/build_pdf.py
      - uses: actions/upload-artifact@v4
        with:
          name: style-my-scent-exact-image-worklist
          path: Style_My_Scent_Exact_Bottle_Image_Worklist.pdf
          if-no-files-found: error
