name: Add website Discover similarity percent

on:
  push:
    paths:
      - '.github/triggers/add-discover-similarity-percent-v1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Add verified comparison percentages
        run: node scripts/add-discover-similarity-percent-v1.mjs
      - name: Validate website markup
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');if(!h.includes('women-similarity-label')||!h.includes('men-similarity-label'))process.exit(1);"
      - name: Commit website change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "style-my-scent-bot"
          git config user.email "style-my-scent-bot@users.noreply.github.com"
          git add index.html discover.js
          git commit -m "feat: show verified Discover similarity percent"
          git push origin HEAD:main
