name: Add Discover bottle photos

on:
  push:
    paths:
      - '.github/triggers/add-discover-bottle-photos-v1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Add bottle photos to Discover
        run: node scripts/add-discover-bottle-photos-v1.mjs
      - name: Validate website markup
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');for(const x of ['Coco Mademoiselle','Club de Nuit Woman','Sauvage Elixir','Asad','scent-bottle'])if(!s.includes(x))throw new Error('Missing '+x);console.log('Discover photos markup OK')"
      - name: Commit website change
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "style-my-scent-bot"
          git config user.email "style-my-scent-bot@users.noreply.github.com"
          git add index.html
          git commit -m "feat: add bottle photos to Discover comparisons"
          git push origin HEAD:main
