name: Website smoke check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  site-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate comparison JavaScript
        run: |
          node --check discover.js
          node --check fragrance.js

      - name: Verify launch legal and support pages
        run: |
          test "$(cat CNAME)" = "stylemyscent.com"
          for file in privacy.html terms.html affiliate-disclosure.html support.html contact.html delete-account.html; do
            test -s "$file"
          done
          grep -q 'privacy.html' index.html
          grep -q 'terms.html' index.html
          grep -q 'affiliate-disclosure.html' index.html
          grep -q 'support.html' index.html
          grep -q 'delete-account.html' index.html

      - name: Verify dupe education contract
        run: |
          grep -q "MAX_DUPES_PER_DESIGNER=2" fragrance.js
          grep -q "SNAPSHOT" fragrance.js
          grep -q "BREAKDOWN" fragrance.js
          grep -q "ACTION" fragrance.js
          grep -q "comparisonEducation" fragrance.js
          grep -q "profileComparisonEducation" discover.js
          grep -q "Use the similarity score as a reference" fragrance.js
          ! grep -q "At about .*% similarity" fragrance.js
          ! grep -q "same recognizable scent direction" fragrance.js

      - name: Verify Discover affiliate safety
        run: |
          grep -q "rel='sponsored noopener noreferrer'" discover.js
          grep -q "safeHttpsUrl" discover.js
          grep -q "affiliate_url" discover.js
