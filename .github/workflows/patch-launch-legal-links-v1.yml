name: Patch launch legal links

on:
  push:
    paths:
      - '.github/triggers/patch-launch-legal-links-v1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/patch-launch-legal-links-v1.mjs
      - name: Verify required launch pages and links
        run: |
          test -f privacy.html
          test -f terms.html
          test -f support.html
          test -f delete-account.html
          test -f affiliate-disclosure.html
          grep -q 'href="support.html"' index.html
          grep -q 'href="delete-account.html"' index.html
      - name: Commit website launch-link repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "style-my-scent-bot"
          git config user.email "style-my-scent-bot@users.noreply.github.com"
          git add index.html
          git commit -m "Add support and account deletion launch links"
          git push origin HEAD:main
